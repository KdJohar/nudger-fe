server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep browser API traffic on the same origin, including LAN/mobile clients.
  location /v1/ {
    proxy_pass ${API_PROXY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    proxy_pass ${API_PROXY_UPSTREAM}/docs;
  }

  location /docs/ {
    proxy_pass ${API_PROXY_UPSTREAM}/docs/;
  }

  location = /openapi.json {
    proxy_pass ${API_PROXY_UPSTREAM}/openapi.json;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
