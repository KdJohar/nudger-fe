server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Generated from the same public route list as the sitemap and HTML.
  include /etc/nginx/snippets/public-pages.conf;

  location = /index.html { return 308 /$is_args$args; }
  location = /app.html { add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /404.html { internal; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
  error_page 404 /404.html;

  # Only known merchant routes receive the client application shell.
  location ~ ^/(?:login|auth/callback|onboarding|pending|workspace|dashboard|audience|compose|nudges|profile|token)/?$ {
    try_files /app.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /robots.txt { add_header Cache-Control "no-cache" always; }
  location = /sitemap.xml { add_header Cache-Control "no-cache" always; }

  # Keep browser API traffic on the same origin, including LAN/mobile clients.
  location ^~ /v1/ {
    proxy_pass ${API_PROXY_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    proxy_pass ${API_PROXY_UPSTREAM}/docs;
  }

  location ^~ /docs/ {
    proxy_pass ${API_PROXY_UPSTREAM}/docs/;
  }

  location = /openapi.json {
    proxy_pass ${API_PROXY_UPSTREAM}/openapi.json;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location / {
    return 404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?|ttf|eot)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }
}
